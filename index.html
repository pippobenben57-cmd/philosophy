main{max-width:880px}

<script>
"use strict";
const $=s=>document.querySelector(s),main=$("#main"),qres=$("#qres"),q=$("#q");
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const row=(h,p)=>`<div class="row"><h4>${esc(h)}</h4><p>${esc(p)}</p></div>`;

  qres.innerHTML=out.length?`<p>${out.length>=60?"前 60 条":out.length+" 条"}</p>`+out.map(x=>`<button data-go="${esc(x.go)}"><b>${esc(x.w)}</b><span>${esc(x.t)}</span>　<small class="soft">${snip(x.x,s)||""}</small></button>`).join(""):`<p>没有找到，换个词试试。</p>`});
route();
</script>
</body>
